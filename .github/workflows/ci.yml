name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            test_bash: bash
          - os: macos-26
            test_bash: /bin/bash
    defaults:
      run:
        shell: bash
    env:
      TEST_BASH: ${{ matrix.test_bash }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install check tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends jq shellcheck
          else
            brew install jq shellcheck
          fi
          python -m pip install --disable-pip-version-check pyright==1.1.414 ruff==0.17.4

      - name: Check syntax, style and types
        run: |
          for file in ipwho lib/*.sh lib/providers/*.sh examples/*.sh tests/*.sh; do
            "$TEST_BASH" -n "$file"
          done
          shellcheck ipwho lib/*.sh lib/providers/*.sh examples/*.sh tests/*.sh
          ruff check --select E,F,I,UP --target-version py315 lib/providers/ovh_api.py
          ruff format --check lib/providers/ovh_api.py
          pyright

      - name: Run mocked tests
        run: |
          for test in tests/*.sh; do
            "$TEST_BASH" "$test"
          done
